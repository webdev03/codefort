name: Security tests
on:
  push:
    branches: [security/sandbox-hardening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [rootless, rootful]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx --package typescript@5.9.3 tsc --noEmit
      - run: bun run test
      - name: Install container runtime
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build sandbox image
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = rootful ]; then
            sudo podman build -t localhost/codefort-sandbox:local -f Containerfile .
          else
            podman build -t localhost/codefort-sandbox:local -f Containerfile .
          fi
      - name: Real sandbox regressions
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = rootful ]; then
            sudo env "PATH=$PATH" CODEFORT_INTEGRATION=1 bun test tests/integration.test.ts
          else
            CODEFORT_INTEGRATION=1 bun test tests/integration.test.ts
          fi
